[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geprior"
version = "5.0.0"
description = "LLM-selected features against classical feature selection for Grammatical Evolution in the few-shot regime, on the FeatLLM and Memar et al. (2026) benchmarks"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "deap>=1.4",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[tool.setuptools]
packages = ["geprior"]
